name: template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    # this workflow belongs to the template repo; copies made from it must not run it
    if: github.repository == 'cshum/go-react-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.12
      - name: both shapes scaffold green
        run: |
          set -euo pipefail
          ./scripts/scaffold.sh /tmp/probe-full 2>&1 | tee /tmp/full.log
          if grep -qi 'traceback\|no such file' /tmp/full.log; then exit 1; fi
          cd /tmp/probe-full && ./scripts/preflight.sh --ci
          cd "$GITHUB_WORKSPACE"
          ./scripts/scaffold.sh /tmp/probe-go --go-only 2>&1 | tee /tmp/go.log
          if grep -qi 'traceback\|no such file' /tmp/go.log; then exit 1; fi
          cd /tmp/probe-go && ./scripts/preflight.sh --ci

      # the README claims the demo can be deleted without touching scripts/; prove it every push
      - name: recipe in the README still holds
        run: |
          set -euo pipefail
          ./scripts/recipe-check.sh "$RUNNER_TEMP/recipe"

